      - name: Find Gradle project
        run: |
          GRADLEW=$(find stockvoice -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find stockvoice -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockVoice-debug-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
